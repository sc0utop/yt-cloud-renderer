name: Cloud Video Factory
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  render_video:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & Pillow
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests pillow

      - name: Fetch Audio, Render 1080p MP4 + 3 Shorts, Upload to Drive
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          cat << 'EOF' > cloud_render.py
          import os, re, json, random, subprocess, requests
          from PIL import Image, ImageDraw, ImageFont

          URL = os.environ["GAS_WEBAPP_URL"]
          r = requests.post(URL, json={"action": "get_next_audio"}, timeout=60).json()
          if not r.get("found"):
              print("No unrendered _Audio.wav files waiting in Drive. Exiting cleanly.")
              exit(0)

          base = r["baseName"]
          audio_id = r["audioFileId"]
          folder_id = r["videoFolderId"]
          token = r["oauthToken"]
          auth_hdr = {"Authorization": f"Bearer {token}"}

          # Build Google Drive API URLs from plain words so no chat filter can ever corrupt them!
          HOST = "www." + "googleapis" + ".com"
          DRIVE_FILES_URL = "/".join(["https:", "", HOST, "drive", "v3", "files"])
          DRIVE_UPLOAD_URL = "/".join(["https:", "", HOST, "upload", "drive", "v3", "files"])

          print(f"[+] Downloading {base}_Audio.wav directly from Google Drive API...")
          dl_url = DRIVE_FILES_URL + "/" + audio_id + "?alt=media"
          with open("input.wav", "wb") as f:
              f.write(requests.get(dl_url, headers=auth_hdr, timeout=120).content)

          res = subprocess.run(["ffmpeg", "-i", "input.wav"], stderr=subprocess.PIPE, text=True)
          m = re.search(r"Duration:\s*(\d+):(\d+):(\d+\.\d+)", res.stderr)
          dur = int(m.group(1))*3600 + int(m.group(2))*60 + float(m.group(3)) if m else 600.0

          f_bold = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 44)
          f_sub = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 26)
          clips = []

          for idx in range(8):
              img = Image.new("RGB", (1920, 1080), (8, 12, 22))
              draw = ImageDraw.Draw(img)
              for x in range(0, 1920, 80):
                  draw.line([(x, 0), (x, 1080)], fill=(18, 28, 46))
              for y in range(0, 1080, 80):
                  draw.line([(0, y), (1920, y)], fill=(18, 28, 46))
              hdr_box = (100, 90, 1820, 96)
              draw.rectangle(hdr_box, fill=(220, 38, 38))
              draw.text((100, 115), f"FORENSIC TELEMETRY // CASE #{1040+idx}", fill=(239, 68, 68), font=f_sub)
              draw.text((100, 165), base.replace("_", " ").upper()[:52], fill=(255, 255, 255), font=f_bold)
              random.seed(idx * 31)
              for b in range(36):
                  bh = random.randint(25, 280)
                  bx1 = 120 + b * 46
                  bx2 = 152 + b * 46
                  bar_box = (bx1, 620 - bh, bx2, 620 + bh)
                  draw.rectangle(bar_box, fill=(56, 189, 248) if b % 4 else (220, 38, 38))
              img.save(f"s_{idx}.png")
              c_mp4 = f"c_{idx}.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-loop", "1", "-i", f"s_{idx}.png", "-t", "6",
                  "-vf", "zoompan=z='min(zoom+0.001,1.15)':d=144:s=1920x1080:fps=24",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28", "-pix_fmt", "yuv420p", c_mp4
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              clips.append(c_mp4)

          total_cuts = int(dur // 6) + 3
          with open("list.txt", "w") as lf:
              for i in range(total_cuts):
                  lf.write(f"file '{clips[i % len(clips)]}'\n")

          master = f"{base}_Master_16x9.mp4"
          print(f"[+] Stitching {dur/60:.1f}-min 1080p Master Video...")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "list.txt", "-i", "input.wav",
              "-c:v", "copy", "-c:a", "aac", "-b:a", "128k", "-shortest", master
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def upload_to_drive(local_file):
              print(f"[+] Direct-uploading {local_file} to Google Drive 04_Rendered_Videos...")
              meta = {"name": local_file, "parents": [folder_id], "mimeType": "video/mp4"}
              r1 = requests.post(DRIVE_FILES_URL, headers=auth_hdr, json=meta, timeout=30).json()
              file_id = r1["id"]

              up_url = DRIVE_UPLOAD_URL + "/" + file_id + "?uploadType=media"
              up_hdr = {"Authorization": f"Bearer {token}", "Content-Type": "video/mp4"}
              with open(local_file, "rb") as vf:
                  r2 = requests.patch(up_url, headers=up_hdr, data=vf, timeout=300)
              print(f"[✓] Uploaded {local_file} -> HTTP {r2.status_code}")

          upload_to_drive(master)

          for idx, pct in enumerate([0.20, 0.50, 0.75], 1):
              start_sec = max(5, int(dur * pct))
              short_mp4 = f"{base}_Short_{idx}_9x16.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-ss", str(start_sec), "-t", "55", "-i", master,
                  "-vf", "scale=-1:1920,crop=1080:1920",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28",
                  "-c:a", "aac", "-b:a", "128k", short_mp4
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              upload_to_drive(short_mp4)

          print("[DONE] Master + 3 Vertical Shorts saved in 04_Rendered_Videos!")
          EOF
          python3 cloud_render.py
