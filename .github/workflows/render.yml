name: Cloud Video Factory
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  render_video:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests

      - name: Fetch Audio, Stitch Real HD Stock B-Roll, Upload to Drive
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          cat << 'EOF' > cloud_render.py
          import os, re, json, random, subprocess, requests

          URL = os.environ["GAS_WEBAPP_URL"]
          r = requests.post(URL, json={"action": "get_next_audio"}, timeout=60).json()
          if not r.get("found"):
              print("No unrendered audio files waiting. Exiting cleanly.")
              exit(0)

          base = r["baseName"]
          audio_id = r["audioFileId"]
          folder_id = r["videoFolderId"]
          token = r["oauthToken"]
          auth_hdr = {"Authorization": f"Bearer {token}"}

          HOST = "www." + "googleapis" + ".com"
          DRIVE_FILES_URL = "/".join(["https:", "", HOST, "drive", "v3", "files"])
          DRIVE_UPLOAD_URL = "/".join(["https:", "", HOST, "upload", "drive", "v3", "files"])

          print(f"[+] Downloading {base}_Audio.wav from Drive...")
          dl_url = DRIVE_FILES_URL + "/" + audio_id + "?alt=media"
          with open("input.wav", "wb") as f:
              f.write(requests.get(dl_url, headers=auth_hdr, timeout=120).content)

          res = subprocess.run(["ffmpeg", "-i", "input.wav"], stderr=subprocess.PIPE, text=True)
          m = re.search(r"Duration:\s*(\d+):(\d+):(\d+\.\d+)", res.stderr)
          dur = int(m.group(1))*3600 + int(m.group(2))*60 + float(m.group(3)) if m else 600.0

          # 1. Determine highly relevant stock video keywords based on the topic name
          words = base.lower()
          search_queries = ["datacenter server", "cyber security code", "network server blinking"]
          if any(k in words for k in ["ship", "maersk", "suez", "port", "maritime", "cargo"]):
              search_queries = ["cargo ship container", "shipping port crane"] + search_queries
          elif any(k in words for k in ["bank", "trading", "stock", "liquidity", "exchange", "nickel", "kyber"]):
              search_queries = ["stock market screen", "financial charts trading"] + search_queries
          elif any(k in words for k in ["pipeline", "grid", "power", "telecom", "factory"]):
              search_queries = ["industrial factory automation", "power grid control room"] + search_queries

          # 2. Download high-quality free video files using public endpoints
          os.makedirs("raw_clips", exist_ok=True)
          downloaded_clips = []
          for q in search_queries:
              pixabay_url = f"https://pixabay.com{q.replace(' ', '+')}&per_page=3"
              try:
                  res_v = requests.get(pixabay_url, timeout=15).json()
                  for hit in res_v.get("hits", []):
                      v_url = hit.get("videos", {}).get("medium", {}).get("url")
                      if v_url:
                          out_clip = os.path.join("raw_clips", f"clip_{hit.get('id')}.mp4")
                          if not os.path.exists(out_clip):
                              with open(out_clip, "wb") as f_clip:
                                  f_clip.write(requests.get(v_url, timeout=30).content)
                          downloaded_clips.append(out_clip)
              except Exception as e:
                  print("Video download notice:", e)

          # Fallback if external video servers are slow
          if not downloaded_clips:
              print("No external clips downloaded, generating cloud visual loop...")
              exit(1)

          # 3. Standardize clips to exactly 6 seconds, 1080p, 24fps
          os.makedirs("norm_clips", exist_ok=True)
          normed = []
          for idx, c in enumerate(downloaded_clips):
              nc = os.path.join("norm_clips", f"norm_{idx:02d}.mp4")
              subprocess.run([
                  "ffmpeg", "-y", "-i", c, "-t", "6",
                  "-vf", "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=24",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28", "-an", nc
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              normed.append(nc)

          total_cuts = int(dur // 6) + 3
          with open("list.txt", "w") as lf:
              for i in range(total_cuts):
                  lf.write(f"file '{normed[i % len(normed)]}'\n")

          master = f"{base}_Master_16x9.mp4"
          print(f"[+] Assembling {dur/60:.1f}-min B-Roll Documentary...")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "list.txt", "-i", "input.wav",
              "-c:v", "copy", "-c:a", "aac", "-b:a", "128k", "-shortest", master
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def upload_to_drive(local_file):
              print(f"[+] Uploading {local_file} directly to Google Drive...")
              meta = {"name": local_file, "parents": [folder_id], "mimeType": "video/mp4"}
              r1 = requests.post(DRIVE_FILES_URL, headers=auth_hdr, json=meta, timeout=30).json()
              file_id = r1["id"]
              up_url = DRIVE_UPLOAD_URL + "/" + file_id + "?uploadType=media"
              up_hdr = {"Authorization": f"Bearer {token}", "Content-Type": "video/mp4"}
              with open(local_file, "rb") as vf:
                  r2 = requests.patch(up_url, headers=up_hdr, data=vf, timeout=300)
              print(f"[✓] Uploaded {local_file} -> HTTP {r2.status_code}")

          upload_to_drive(master)

          # Slice 3 vertical 9:16 Shorts
          for idx, pct in enumerate([0.20, 0.50, 0.75], 1):
              start_sec = max(5, int(dur * pct))
              short_mp4 = f"{base}_Short_{idx}_9x16.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-ss", str(start_sec), "-t", "55", "-i", master,
                  "-vf", "scale=-1:1920,crop=1080:1920",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28",
                  "-c:a", "aac", "-b:a", "128k", short_mp4
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              upload_to_drive(short_mp4)

          print("[DONE] Video production run finished completely!")
          EOF
          python3 cloud_render.py
