name: Cloud Video Factory
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  render_video:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests pillow

      - name: Fetch Audio, Render 1080p MP4 + 3 Shorts, Upload to Drive
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          cat << 'EOF' > cloud_render.py
          import os, re, json, random, subprocess, requests
          from PIL import Image, ImageDraw, ImageFont

          URL = os.environ["GAS_WEBAPP_URL"]
          r = requests.post(URL, json={"action": "get_next_audio"}, timeout=60).json()
          if not r.get("found"):
              print("No unrendered audio files waiting in Drive. Exiting cleanly.")
              exit(0)

          base = r["baseName"]
          audio_id = r["audioFileId"]
          folder_id = r["videoFolderId"]
          token = r["oauthToken"]
          auth_hdr = {"Authorization": f"Bearer {token}"}

          HOST = "www." + "googleapis" + ".com"
          DRIVE_FILES_URL = "/".join(["https:", "", HOST, "drive", "v3", "files"])
          DRIVE_UPLOAD_URL = "/".join(["https:", "", HOST, "upload", "drive", "v3", "files"])

          print(f"[+] Downloading {base}_Audio.wav from Drive...")
          dl_url = DRIVE_FILES_URL + "/" + audio_id + "?alt=media"
          with open("input.wav", "wb") as f:
              f.write(requests.get(dl_url, headers=auth_hdr, timeout=120).content)

          res = subprocess.run(["ffmpeg", "-i", "input.wav"], stderr=subprocess.PIPE, text=True)
          m = re.search(r"Duration:\s*(\d+):(\d+):(\d+\.\d+)", res.stderr)
          dur = int(m.group(1))*3600 + int(m.group(2))*60 + float(m.group(3)) if m else 600.0

          f_bold = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 36)
          f_sub = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 22)

          def text_width(text, font):
              img_t = Image.new("RGB", (1, 1))
              d_t = ImageDraw.Draw(img_t)
              bbox = d_t.textbbox((0, 0), text, font=font)
              return bbox[2] - bbox[0]

          def wrap_text(text, font, max_w):
              words = text.split()
              lines, cur = [], ""
              for w in words:
                  test = (cur + " " + w).strip()
                  if text_width(test, font) <= max_w:
                      cur = test
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              return lines

          def clean_hud_text(text):
              # Hard-strip all brackets, asterisks, lines, and tokens
              s = text.replace("**", "").replace("[", "").replace("]", "").replace("#", "").replace("_", " ").strip()
              s = re.sub(r'^(visual|audio|narrator|cue|timeline|scene|director|sfx|sound)\s*:?\s*', '', s, flags=re.I)
              return s.strip()

          title_clean = clean_hud_text(base).upper()
          clips = []

          # Build 8 perfectly formatted moving telemetry boards
          for idx in range(8):
              img = Image.new("RGB", (1920, 1080), (8, 12, 22))
              draw = ImageDraw.Draw(img)
              
              for x in range(0, 1920, 80): draw.line([(x, 0), (x, 1080)], fill=(18, 28, 46), width=1)
              for y in range(0, 1080, 80): draw.line([(0, y), (1920, y)], fill=(18, 28, 46), width=1)
              
              # Standard Top Header Box
              draw.rectangle([100, 70, 1820, 76], fill=(220, 38, 38))
              draw.text((100, 95), f"FORENSIC ANALYTICS // DATA STACK NODE #{1040+idx}", fill=(239, 68, 68), font=f_sub)
              
              # Safe Auto-Wrapped Main Title Text Block
              wrapped_lines = wrap_text(title_clean, f_bold, 1600)
              y_offset = 145
              for wl in wrapped_lines[:2]:
                  draw.text((100, y_offset), wl, fill=(255, 255, 255), font=f_bold)
                  y_offset += 50
              
              random.seed(idx * 43)
              for b in range(38):
                  bh = random.randint(30, 260)
                  bx1 = 120 + b * 44
                  bx2 = 148 + b * 44
                  draw.rectangle([bx1, 640 - bh, bx2, 640 + bh], fill=(56, 189, 248) if b % 4 else (220, 38, 38))
                  
              img.save(f"s_{idx}.png")
              c_mp4 = f"c_{idx}.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-loop", "1", "-i", f"s_{idx}.png", "-t", "6",
                  "-vf", "zoompan=z='min(zoom+0.001,1.14)':d=144:s=1920x1080:fps=24",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28", "-pix_fmt", "yuv420p", c_mp4
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              clips.append(c_mp4)
              os.remove(f"s_{idx}.png")

          total_cuts = int(dur // 6) + 3
          with open("list.txt", "w") as lf:
              for i in range(total_cuts):
                  lf.write(f"file '{clips[i % len(clips)]}'\n")

          master = f"{base}_Master_16x9.mp4"
          print(f"[+] Assembling {dur/60:.1f}-min 1080p Master Video...")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "list.txt", "-i", "input.wav",
              "-c:v", "copy", "-c:a", "aac", "-b:a", "128k", "-shortest", master
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          def upload_to_drive(local_file):
              print(f"[+] Uploading {local_file} directly to Google Drive...")
              meta = {"name": local_file, "parents": [folder_id], "mimeType": "video/mp4"}
              r1 = requests.post(DRIVE_FILES_URL, headers=auth_hdr, json=meta, timeout=30).json()
              file_id = r1["id"]
              up_url = DRIVE_UPLOAD_URL + "/" + file_id + "?uploadType=media"
              up_hdr = {"Authorization": f"Bearer {token}", "Content-Type": "video/mp4"}
              with open(local_file, "rb") as vf:
                  r2 = requests.patch(up_url, headers=up_hdr, data=vf, timeout=300)
              print(f"[✓] Uploaded {local_file} -> HTTP {r2.status_code}")

          upload_to_drive(master)

          for idx, pct in enumerate([0.20, 0.50, 0.75], 1):
              start_sec = max(5, int(dur * pct))
              short_mp4 = f"{base}_Short_{idx}_9x16.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-ss", str(start_sec), "-t", "55", "-i", master,
                  "-vf", "scale=-1:1920,crop=1080:1920",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28",
                  "-c:a", "aac", "-b:a", "128k", short_mp4
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              upload_to_drive(short_mp4)

          print("[DONE] Video production run finished completely!")
          EOF
          python3 cloud_render.py
